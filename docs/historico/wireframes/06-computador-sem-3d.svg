<circle cx="1533" cy="86" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="90.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="1556" y="91" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">As mesmas seções numa página comum, uma</text><text x="1556" y="111" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">abaixo da outra, numa coluna de 720 px.</text><circle cx="1533" cy="154" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="158.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="1556" y="159" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">O menu rola a página até a seção</text><text x="1556" y="179" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">escolhida.</text><circle cx="1533" cy="222" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="226.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="1556" y="227" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">Este modo liga sozinho se o navegador</text><text x="1556" y="247" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">não tiver WebGL. O botão "Ver em 3D"</text><text x="1556" y="267" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">volta para o quarto.</text><circle cx="1533" cy="310" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="314.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="1556" y="315" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">Usa os mesmos componentes do painel do</text><text x="1556" y="335" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">modo 3D, então o conteúdo nunca fica</text><text x="1556" y="355" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">diferente.</text>
