<circle cx="1533" cy="86" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="90.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="1556" y="91" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">A câmera voa até o monitor e desloca a</text><text x="1556" y="111" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">imagem para a esquerda, para o objeto</text><text x="1556" y="131" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">não ficar escondido atrás do painel.</text><circle cx="1533" cy="174" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="178.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="1556" y="179" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">Painel lateral (até 460 px) com rolagem</text><text x="1556" y="199" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">própria. O X, a tecla ESC ou um clique</text><text x="1556" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">fora voltam ao quarto.</text><circle cx="1533" cy="262" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="266.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="1556" y="267" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">Linha do tempo do projeto mais antigo ao</text><text x="1556" y="287" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">mais recente.</text><circle cx="1533" cy="330" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="334.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="1556" y="335" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">Cada projeto tem GIF dele funcionando,</text><text x="1556" y="355" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">nome, descrição, tecnologias e link do</text><text x="1556" y="375" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">GitHub.</text><circle cx="1533" cy="418" r="13" fill="#d9480f" stroke="none" stroke-width="1"/><text x="1533" y="422.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="1556" y="423" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">O item da seção aberta fica destacado no</text><text x="1556" y="443" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#262624" text-anchor="start">menu.</text>
