        <script>

            try {
                const mode = localStorage.getItem('portfolio-theme');
                if (mode === 'day' || mode === 'night') document.documentElement.dataset.mode = mode;
            } catch {
                // sem armazenamento: o App decide pelo tema do sistema
            }
        </script>
